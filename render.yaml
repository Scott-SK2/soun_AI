services:
  # ── FastAPI — LLM microservice (Phi-3 Mini on persistent disk) ────────────
  - type: web
    name: soun-ai-api
    runtime: python
    plan: standard              # Standard plan required for 2 GB RAM (Phi-3 Mini)
    rootDir: api
    buildCommand: CMAKE_ARGS="-DGGML_CUDA=OFF -DGGML_METAL=OFF -DGGML_BLAS=OFF" pip install -r requirements.txt
    startCommand: python start.py
    disk:
      name: model-storage
      mountPath: /data
      sizeGB: 5                 # 5 GB — Phi-3 Mini GGUF is ~2.4 GB
    envVars:
      - key: LLM_BACKEND
        value: local            # Use Phi-3 Mini — set to "openai" to switch back
      - key: LOCAL_MODEL_PATH
        value: /data/models/Phi-3-mini-4k-instruct-q4.gguf
      - key: LOCAL_N_CTX
        value: "2048"           # Lower context to reduce RAM usage
      - key: LOCAL_N_THREADS
        value: "2"              # Render Standard has 2 vCPUs
      - key: PYTHON_VERSION
        value: "3.11"

  # ── Soun — Node.js full-stack app ─────────────────────────────────────────
  - type: web
    name: soun-app
    runtime: node
    rootDir: Soun
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false            # Set manually in Render dashboard (secret)
      - key: SOUN_AI_URL
        value: https://soun-ai-api.onrender.com   # Update with your actual FastAPI URL
      - key: SESSION_SECRET
        generateValue: true    # Render generates a random secret automatically
