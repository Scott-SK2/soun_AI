services:
  # ── FastAPI — LLM microservice (Groq free API) ────────────────────────────
  - type: web
    name: soun-ai-api
    runtime: python
    plan: starter               # Free Groq API — no heavy model needed
    rootDir: api
    buildCommand: CMAKE_ARGS="-DGGML_CUDA=OFF -DGGML_METAL=OFF -DGGML_BLAS=OFF" pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: LLM_BACKEND
        value: groq             # Free Llama-3 via Groq API
      - key: GROQ_API_KEY
        sync: false             # Set manually in Render dashboard (get free key at console.groq.com)
      - key: PYTHON_VERSION
        value: "3.11"

  # ── Soun — Node.js full-stack app ─────────────────────────────────────────
  - type: web
    name: soun-app
    runtime: node
    rootDir: Soun
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false            # Set manually in Render dashboard (secret)
      - key: SOUN_AI_URL
        value: https://soun-ai-api.onrender.com   # Update with your actual FastAPI URL
      - key: SESSION_SECRET
        generateValue: true    # Render generates a random secret automatically
